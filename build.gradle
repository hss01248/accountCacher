import java.util.function.Consumer

// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    apply from: "https://raw.githubusercontent.com/hss01248/flipperUtil/gradle7_5/deps/uploadAllByMavenPublish.gradle?a=14"
    // Check for latest dependencies
    apply from: 'https://raw.githubusercontent.com/hss01248/flipperUtil/gradle7_5/deps/depsLastestChecker.gradle'
    // Remote utilities script
    //apply from: 'https://raw.githubusercontent.com/hss01248/flipperUtil/gradle7_5/remote3.gradle'

    ext {
        groupId = 'x.x.x'
        versionCode = 'x.x.x'
        isPublisToLocal = true
    }

    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
        classpath 'org.greenrobot:greendao-gradle-plugin:3.3.0'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

gradle.addProjectEvaluationListener(new ProjectEvaluationListener() {
    //@Override
    void beforeEvaluate(Project project) {

    }

    //https://noproxy.github.io/2019/07/01/gradle-discovery-dependencies.html
    @Override
    void afterEvaluate(Project project, ProjectState projectState) {
        def configurations = project.configurations;
        configurations.forEach(new Consumer<Configuration>() {
            @Override
            void accept(Configuration files) {
            }
        })

        Configuration configuration = null;
        try {
            //configuration = project.configurations.getByName("debugCompile");
        }catch(Throwable throwable){
            throwable.printStackTrace()
        }

        if(configuration == null){
            return
        }
    }
})
